title:            SWD6 FR Adventures
longtitle:        Star Wars D6 French Adventures

remote_theme: sighingnow/jekyll-gitbook
toc:
    enabled: true
    h_min: 1
    h_max: 2

extra_css: assets/z_custom.css
extra_header_js: assets/z_heading-links.js

collections:
  backstab_magazine:
    title: "Backstab Magazine"
    output: true
    permalink: /:collection/:path/
  descartes_supplement:
    title: "Descartes Le Supplement"
    output: true
    permalink: /:collection/:path/

ordered_collections:
  - backstab_magazine
  - descartes_supplement

favicon_path: assets/favicon.ico

page_width: 800px
exclude:
  - _draft